name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release-windows:
    name: Build Windows Installer & Portable Bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri installers (NSIS + MSI + updater signature + vaultpass-cli sidecar)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          $updaterCfg = Join-Path $env:RUNNER_TEMP "tauri.updater.json"
          '{"bundle":{"createUpdaterArtifacts":true}}' | Set-Content -Encoding utf8NoBOM $updaterCfg
          node scripts/prepare-cli-sidecar.mjs
          npx tauri build --config src-tauri/tauri.bundle.json --config $updaterCfg

      - name: Stage release artifacts and SHA256 checksums
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $rawTag = if ($env:EVENT_NAME -eq "workflow_dispatch") { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($rawTag -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag format: '$rawTag' (expected vX.Y.Z)."
          }
          $ver = $rawTag.TrimStart("v")
          $outDir = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          $setupExe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          $setupSig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe.sig" | Select-Object -First 1
          if (-not $setupExe -or -not $setupSig) {
            throw "Expected NSIS setup.exe and setup.exe.sig updater artifacts were not produced."
          }
          Copy-Item $setupExe.FullName -Destination $outDir
          Copy-Item $setupSig.FullName -Destination $outDir
          Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Copy-Item -Destination $outDir

          $portableStage = Join-Path $PWD "portable-stage"
          New-Item -ItemType Directory -Force $portableStage | Out-Null
          Copy-Item "src-tauri/target/release/vaultpass.exe" -Destination $portableStage
          Copy-Item "src-tauri/target/x86_64-pc-windows-msvc/release/vaultpass-cli.exe" -Destination $portableStage
          Copy-Item "README.md", "LICENSE" -Destination $portableStage

          $portableZip = Join-Path $outDir "VaultPass_${ver}_x64_portable.zip"
          Compress-Archive -Path "$portableStage/*" -DestinationPath $portableZip -Force

          $sigContent = (Get-Content -Raw $setupSig.FullName).Trim()
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$rawTag/$($setupExe.Name)"
          $latestManifest = [ordered]@{
            version   = $ver
            notes     = "Pembaruan VaultPass $rawTag"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $sigContent
                url       = $downloadUrl
              }
            }
          }
          $latestManifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM (Join-Path $outDir "latest.json")

          Push-Location $outDir
          $hashes = Get-ChildItem -File | Sort-Object Name | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Set-Content -Encoding utf8 "SHA256SUMS.txt"
          Get-Content "SHA256SUMS.txt"
          Pop-Location

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: VaultPass ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            ### Unduhan Windows (64-bit)
            - **`*-setup.exe` (Direkomendasikan):** Installer standar Windows (membuat shortcut di Desktop & Start Menu, sudah termasuk `vaultpass-cli.exe`).
            - **`*.msi`:** Paket Windows Installer alternatif.
            - **`*_portable.zip`:** Versi portable tanpa instalasi (`vaultpass.exe` + `vaultpass-cli.exe`).
            - **`SHA256SUMS.txt`:** Checksum SHA-256 untuk memverifikasi keaslian file.

            > **Catatan Windows SmartScreen:** Aplikasi ini open-source dan belum menggunakan sertifikat *code-signing* berbayar. Jika muncul peringatan *"Windows protected your PC"* saat pertama kali membuka installer, klik **More info** lalu **Run anyway**.
          files: release-assets/*
