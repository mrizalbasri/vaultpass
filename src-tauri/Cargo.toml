[package]
name = "vaultpass"
version = "0.1.0"
description = "Personal offline desktop password manager built with Tauri and Rust"
authors = ["Rizal Basri"]
edition = "2021"
default-run = "vaultpass"

[lib]
name = "vaultpass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vaultpass"
path = "src/main.rs"

[[bin]]
name = "vaultpass-cli"
path = "src/bin/vaultpass_cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.6"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
arboard = "3"
rfd = "0.15"
windows = { version = "0.62", features = ["Security_Credentials_UI"] }
